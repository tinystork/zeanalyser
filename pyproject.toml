[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ZeAnalyser"
dynamic = ["version"]
description = "Standalone analysis module for Seestar light frames: sorting and filtering of Lights to discard low-quality frames and yield optimal star-field composites."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [
    { name = "Tristan Nauleau (Tinystork)" },
]
keywords = ["astronomy", "seestar", "stacking", "fits", "astrophotography"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy",
    "astropy",
    "matplotlib",
    "PySide6>=6.6",
    "Pillow",
    "scipy",
    "scikit-image",
    "astroalign",
    "photutils",
]

[project.optional-dependencies]
bortle = ["rasterio"]
trails = ["acstools"]
tools = ["drizzle"]

[project.scripts]
zeanalyser = "zeanalyser.analyse_gui_qt:main"

[project.urls]
Homepage = "https://github.com/tinystork/zeanalyser"

[tool.setuptools.dynamic]
version = { attr = "zeanalyser._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zeanalyser = ["icon/*", "*.json"]
